<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" shape-rendering="crispEdges">
  <!-- elongated dome crest -->
  <rect x="6" y="10" width="14" height="4" fill="#1a202c"/>
  <rect x="5" y="12" width="16" height="6" fill="#2d3748"/>
  <rect x="6" y="13" width="14" height="4" fill="#4a5568"/>
  <!-- dome ridges -->
  <rect x="8" y="11" width="2" height="8" fill="#1a202c"/>
  <rect x="12" y="10" width="2" height="9" fill="#1a202c"/>
  <rect x="16" y="11" width="2" height="8" fill="#1a202c"/>
  <!-- long skull body -->
  <rect x="7" y="18" width="14" height="12" fill="#2d3748"/>
  <rect x="8" y="19" width="12" height="10" fill="#4a5568"/>
  <rect x="9" y="20" width="10" height="7" fill="#718096"/>
  <!-- eye pits -->
  <rect x="9" y="21" width="4" height="3" fill="#1a202c"/>
  <rect x="15" y="21" width="4" height="3" fill="#1a202c"/>
  <rect x="10" y="22" width="2" height="1" fill="#9b2c2c"/>
  <rect x="16" y="22" width="2" height="1" fill="#9b2c2c"/>
  <!-- ribbed pipe / tube on side -->
  <rect x="3" y="16" width="4" height="14" fill="#1a202c"/>
  <rect x="4" y="17" width="2" height="2" fill="#718096"/>
  <rect x="4" y="20" width="2" height="2" fill="#a0aec0"/>
  <rect x="4" y="23" width="2" height="2" fill="#718096"/>
  <rect x="4" y="26" width="2" height="2" fill="#a0aec0"/>
  <!-- second pipe -->
  <rect x="20" y="18" width="3" height="10" fill="#1a202c"/>
  <rect x="21" y="19" width="1" height="2" fill="#718096"/>
  <rect x="21" y="22" width="1" height="2" fill="#a0aec0"/>
  <rect x="21" y="25" width="1" height="2" fill="#718096"/>
  <!-- mandibles / inner jaw -->
  <rect x="9" y="28" width="3" height="5" fill="#2d3748"/>
  <rect x="14" y="28" width="3" height="5" fill="#2d3748"/>
  <rect x="10" y="29" width="1" height="4" fill="#e2e8f0"/>
  <rect x="15" y="29" width="1" height="4" fill="#e2e8f0"/>
  <rect x="11" y="32" width="4" height="2" fill="#4a5568"/>
  <!-- secondary inner prongs -->
  <rect x="12" y="30" width="2" height="3" fill="#a0aec0"/>
  <!-- mount strap to shoulder -->
  <rect x="18" y="26" width="7" height="2" fill="#ecc94b"/>
  <rect x="22" y="28" width="3" height="2" fill="#d69e2e"/>
</svg>
