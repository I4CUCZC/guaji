<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" shape-rendering="crispEdges">
  <!-- shoulder trophy skull — original alien-beast silhouette -->
  <rect x="8" y="20" width="12" height="10" fill="#2d3748"/>
  <rect x="9" y="21" width="10" height="8" fill="#4a5568"/>
  <!-- elongated snout -->
  <rect x="6" y="24" width="5" height="4" fill="#718096"/>
  <rect x="5" y="25" width="3" height="2" fill="#a0aec0"/>
  <!-- eyes -->
  <rect x="11" y="22" width="3" height="2" fill="#9b2c2c"/>
  <rect x="15" y="22" width="2" height="2" fill="#9b2c2c"/>
  <!-- crest spines (not xenomorph) -->
  <rect x="10" y="17" width="2" height="4" fill="#1a202c"/>
  <rect x="13" y="16" width="2" height="5" fill="#2d3748"/>
  <rect x="16" y="18" width="2" height="3" fill="#1a202c"/>
  <!-- jaw -->
  <rect x="9" y="28" width="8" height="3" fill="#2d3748"/>
  <rect x="10" y="29" width="2" height="2" fill="#e2e8f0"/>
  <rect x="14" y="29" width="2" height="2" fill="#e2e8f0"/>
  <!-- mount strap -->
  <rect x="16" y="26" width="6" height="2" fill="#ecc94b"/>
